name: Code checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m compileall -q itag.py tests
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/*.sh
